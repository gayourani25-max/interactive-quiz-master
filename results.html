<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Quiz Results</title>
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <main class="page">

        <section class="card result-card">

            <div class="icon">
                🏆
            </div>

            <h1>
                Quiz Completed!
            </h1>

            <p>
                Your final score is:
            </p>


            <div class="final-score">

                <span id="finalScore">
                    0
                </span>

                <span>
                    / 10
                </span>

            </div>


            <p
                id="resultText"
                class="result-text">
            </p>


            <button
                id="restartBtn"
                class="btn">

                Restart Quiz

            </button>


            <a
                href="./index.html"
                class="home-btn">

                Back to Home

            </a>

        </section>

    </main>



    <script src="./questions.js"></script>

    <script src="./results.js"></script>

</body>

</html>
