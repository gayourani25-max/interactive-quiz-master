<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Quiz - Interactive Quiz Master</title>

    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <main class="page">

        <section class="card quiz-card">


            <div class="quiz-top">

                <div>

                    <small>
                        Question
                    </small>

                    <h2 id="questionNumber">
                        1 / 10
                    </h2>

                </div>

                <div class="score-box">

                    Score:
                    <span id="score">
                        0
                    </span>

                </div>

            </div>



            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">
                </div>

            </div>



            <h1 id="question">
                Loading question...
            </h1>



            <div
                id="options"
                class="options">
            </div>



            <p
                id="message"
                class="message">
            </p>



            <button
                id="nextBtn"
                class="btn"
                disabled>

                Next Question

            </button>

        </section>

    </main>


    <script src="./questions.js"></script>

    <script src="./quiz.js"></script>

</body>

</html>
